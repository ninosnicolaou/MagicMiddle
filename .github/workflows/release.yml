name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    name: Build Magic Middle
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build.sh

      - name: Verify app
        run: |
          test -d "build/Magic Middle.app"
          test -f "build/Magic Middle.app/Contents/MacOS/MagicMiddle"
          file "build/Magic Middle.app/Contents/MacOS/MagicMiddle"
          lipo -info "build/Magic Middle.app/Contents/MacOS/MagicMiddle"

      - name: Package app
        env:
          RELEASE_NAME: Magic-Middle-build-${{ github.run_number }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Magic Middle.app" \
            "build/${RELEASE_NAME}.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_number }}
          RELEASE_NAME: Magic-Middle-build-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" \
            "build/${RELEASE_NAME}.zip" \
            --title "Magic Middle Build #${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --generate-notes
